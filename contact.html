<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Lakshmi, Digital Marketer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#fff;--ink:#14213d;--mute:#5b6478;--line:#e6e9f0;--acc:#1f4fd8;--acc2:#0e9f8e;--soft:#f5f7fc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.75 'Plus Jakarta Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15;font-weight:600}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{max-width:1100px;margin:auto;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-family:'Fraunces',serif;font-size:22px;font-weight:700}
nav ul{display:flex;gap:26px;list-style:none;flex-wrap:wrap}
nav ul a{position:relative;font-weight:600;font-size:15px;color:var(--mute);padding:4px 0;transition:color .25s}
nav ul a::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:0;background:var(--acc);transition:width .3s}
nav ul a:hover,nav ul a.on{color:var(--ink)}nav ul a:hover::after,nav ul a.on::after{width:100%}
main{max-width:1100px;margin:auto;padding:72px 24px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;min-height:62vh}
.hero h1{font-size:clamp(38px,6vw,64px);margin-bottom:20px}
.lead{font-size:19px;color:var(--mute);max-width:56ch;margin-bottom:28px}
h1.page{font-size:clamp(34px,5vw,52px);margin-bottom:12px}
h2{font-size:28px;margin:44px 0 14px}
p{margin-bottom:16px;max-width:70ch;color:#2b3550}
.btn{display:inline-block;padding:13px 26px;border-radius:8px;font-weight:700;background:var(--acc);color:#fff;margin-right:12px;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(31,79,216,.28)}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{box-shadow:0 12px 24px rgba(20,33,61,.15)}
.scene{perspective:900px;display:grid;place-items:center;height:300px}
.cube{width:150px;height:150px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
.scene:hover .cube{animation-play-state:paused}
.cube div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;font-size:15px;color:#fff;border:1px solid rgba(255,255,255,.5)}
.cube div:nth-child(1){transform:translateZ(75px);background:#1f4fd8}
.cube div:nth-child(2){transform:rotateY(90deg) translateZ(75px);background:#0e9f8e}
.cube div:nth-child(3){transform:rotateY(180deg) translateZ(75px);background:#14213d}
.cube div:nth-child(4){transform:rotateY(-90deg) translateZ(75px);background:#3b6cf0}
.cube div:nth-child(5){transform:rotateX(90deg) translateZ(75px);background:#2bb5a4}
.cube div:nth-child(6){transform:rotateX(-90deg) translateZ(75px);background:#33406b}
@keyframes spin{to{transform:rotateX(-20deg) rotateY(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;perspective:1000px;margin:24px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;transition:transform .35s,box-shadow .35s,border-color .35s;transform-style:preserve-3d;will-change:transform}
.card:hover{box-shadow:0 22px 40px rgba(20,33,61,.12);border-color:var(--acc)}
.card h3{font-size:20px;margin-bottom:8px}.card p{font-size:15.5px;margin:0;color:var(--mute)}
.bar{height:8px;background:var(--soft);border-radius:8px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:8px;transition:width 1.2s ease}
.tl{border-left:2px solid var(--line);padding-left:26px;margin:20px 0}
.tl .card{margin-bottom:18px}
.cta{margin-top:56px;padding:40px;background:var(--soft);border-radius:14px;text-align:center}
.cta p{margin:0 auto 18px}
form{display:grid;gap:16px;max-width:560px}
input,textarea{padding:14px;border:1.5px solid var(--line);border-radius:8px;font:inherit;transition:border-color .2s,box-shadow .2s}
input:hover,textarea:hover{border-color:#b9c3dd}input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(31,79,216,.12)}
button.btn{border:0;cursor:pointer;font:inherit;font-weight:700;width:max-content}
footer{border-top:1px solid var(--line);text-align:center;padding:28px;color:var(--mute);font-size:14px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.scene{height:240px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><header><nav><a class="logo" href="index.html">Lakshmi</a><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="skills.html">Skills</a></li><li><a href="experience.html">Experience</a></li><li><a href="projects.html">Projects</a></li><li><a href="contact.html" class=on>Contact</a></li></ul></nav></header><main><h1 class="page">Contact</h1><p class="lead">Tell me about your business and what you want to achieve.</p>
<form onsubmit="event.preventDefault();this.querySelector('button').textContent='Message ready to send'"><input aria-label="Name" placeholder="Your name" required><input aria-label="Email" type="email" placeholder="Your email" required><textarea aria-label="Message" rows="5" placeholder="How can I help?" required></textarea><button class="btn" type="submit">Send message</button></form>
<h2>Direct contact</h2><p>Email: [your email]<br>Phone: [your number]<br>LinkedIn: [your profile link]</p></main><footer>&copy; 2026 Lakshmi. Digital Marketer.</footer><script>
document.querySelectorAll('.card').forEach(c=>{
 c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
 c.style.transform=`rotateY(${x*10}deg) rotateX(${-y*10}deg) translateY(-6px)`});
 c.addEventListener('mouseleave',()=>c.style.transform='');});
requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
</script></body></html>
